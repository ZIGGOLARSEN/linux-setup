set -g prefix C-s
bind C-s send-prefix
unbind C-b

set-option -g default-command "$SHELL"

set -g history-limit 15000
set -g allow-rename off

bind-key j command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:"  "join-pane -t '%%'"

set-window-option -g mode-keys vi

# Bind Alt+Up and Alt+Down to scroll 10 lines at a time
bind -n M-Up if -F "#{pane_in_mode}" "send-keys -X -N 10 cursor-up" "send-keys -N 10 C-Up"
bind -n M-Down if -F "#{pane_in_mode}" "send-keys -X -N 10 cursor-down" "send-keys -N 10 C-Down"

# Bind a key (e.g., prefix + H) to capture the current pane's history and save it to a fil
bind-key H run-shell 'tmux capture-pane -p -S -15000 > ~/tmux-logging/pane-history-$(date "+%Y%m%d-%H%M%S").tmux'

# Reload tmux configuration
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded"
